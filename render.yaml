services:
  - type: web
    name: agraound-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    # El file-lock (fcntl) solo serializa dentro de un host, y el disco
    # persistente se monta en una sola instancia: mantené 1 worker / 1 instancia.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    # Disco persistente independiente para los datos transaccionales de ventas.
    # Sobrevive a redeploys. El catálogo (products/payment_info) viaja en el repo.
    disk:
      name: sales-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Persistencia transaccional: JSON en el volumen persistente montado arriba.
      - key: TX_DATA_DIR
        value: /var/data

      # MongoDB — SOLO registro de ventas (ledger), no fuente de verdad.
      # Opcional: si se deja vacío, el registro en Mongo se desactiva sin error.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: agraound-nda

      # Resend — set manually in Render dashboard
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: contacto@agraound.site
      - key: EMAIL_FROM_NAME
        value: Agraound Consulting
      - key: EMAIL_PROVIDER_TO
        sync: false   # e.g. contacto@agraound.site — must be a full email address

      # App
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random value
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: UPLOAD_DIR
        value: /tmp/uploads   # ephemeral on Render — R2 handles persistence

      # Cloudflare R2 — set manually in Render dashboard
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: agraound-docs
      - key: R2_PRESIGNED_EXPIRY
        value: "3600"
